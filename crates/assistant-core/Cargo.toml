[package]
name = "ivestfii-assistant"
version.workspace = true
edition = "2021"
description = "Provider-independent conversation history and assistant checkpoints for IvestFII"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
