[package]
name = "ivestfii-runtime"
version.workspace = true
edition = "2021"
description = "Supervised local CLI chat adapters for IvestFII"

[dependencies]
ivestfii-assistant = { path = "../assistant-core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
ivestfii-core = { path = "../portfolio-core" }
ivestfii-mcp = { path = "../mcp-server" }
