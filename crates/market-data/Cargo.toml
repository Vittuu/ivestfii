[package]
name = "ivestfii-market-data"
version.workspace = true
edition = "2021"
description = "Dated public economic indicators and news, independent of portfolio data"

[dependencies]
base64 = "0.22.1"
ivestfii-core = { path = "../portfolio-core" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
roxmltree = "0.21"
rust_decimal = "1.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
